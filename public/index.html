<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00a884" />
    <meta
      name="description"
      content="Agni Messenger - Fast, Secure, Real-time Web Messaging Application"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("fire_messenger_theme") || localStorage.getItem("chakra-ui-color-mode") || "dark";
          document.documentElement.setAttribute("data-theme", saved);
          document.documentElement.setAttribute("data-color-mode", saved);
          document.documentElement.className = "chakra-ui-" + saved;
          if (!localStorage.getItem("chakra-ui-color-mode")) {
            localStorage.setItem("chakra-ui-color-mode", saved);
          }
          if (!localStorage.getItem("fire_messenger_theme")) {
            localStorage.setItem("fire_messenger_theme", saved);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Agni Messenger 🔥 | Fast & Secure Real-Time Chat</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
